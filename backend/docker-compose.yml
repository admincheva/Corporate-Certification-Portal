version: "3.9"

services:

  mariadb:
    image: mariadb:11
    container_name: corporate-db

    restart: always

    environment:
      MARIADB_ROOT_PASSWORD: asdf
      MARIADB_DATABASE: corporate_certification_portal_db

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-pasdf"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:

    build: .

    container_name: corporate-backend

    depends_on:
      mariadb:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/corporate_certification_portal_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: asdf

volumes:
  mariadb_data: