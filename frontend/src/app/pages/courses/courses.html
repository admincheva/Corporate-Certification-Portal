<h2 class="mb-4">Courses</h2>

<!-- Filter Section -->
<div class="card p-4 mb-4" style="background-color: #f8f9fa;">
  <h5 class="mb-3">Filter Courses</h5>

  <div class="row mb-3">
    <div class="col-md-6 mb-3">
      <label for="titleFilter" class="form-label">Title</label>
      <input
        type="text"
        class="form-control"
        id="titleFilter"
        [(ngModel)]="filterTitle"
        (input)="applyFilters()"
        placeholder="Search by title">
    </div>

    <div class="col-md-6 mb-3">
      <label class="form-label">Provider</label>
      <select
        class="form-select"
        [(ngModel)]="filterProvider"
        (change)="applyFilters()">
        <option value="">All Providers</option>
        <option *ngFor="let prov of providers" [value]="prov">
          {{ prov }}
        </option>
      </select>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-md-6 mb-3">
      <label class="form-label">Category</label>
      <select
        class="form-select"
        [(ngModel)]="filterCategory"
        (change)="applyFilters()">
        <option value="">All Categories</option>
        <option *ngFor="let cat of categories" [value]="cat">
          {{ cat }}
        </option>
      </select>
    </div>

    <div class="col-md-6 mb-3">
      <label class="form-label">Refundable</label>
      <select
        class="form-select"
        [(ngModel)]="filterRefundable"
        (change)="applyFilters()">
        <option value="">All</option>
        <option value="true">Refundable</option>
        <option value="false">Non-refundable</option>
      </select>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-md-6 mb-3">
      <label class="form-label">Minimum Price ($)</label>
      <input
        type="number"
        class="form-control"
        [(ngModel)]="filterMinPrice"
        (change)="applyFilters()"
        placeholder="0"
        step="0.01">
    </div>

    <div class="col-md-6 mb-3">
      <label class="form-label">Maximum Price ($)</label>
      <input
        type="number"
        class="form-control"
        [(ngModel)]="maxPrice"
        (change)="applyFilters()"
        placeholder="No limit"
        step="0.01">
    </div>
  </div>

  <div class="mt-3">
    <button
      class="btn btn-primary me-2"
      type="button"
      (click)="applyFilters()">
      Apply Filters
    </button>
    <button
      class="btn btn-secondary"
      type="button"
      (click)="resetFilters()">
      Reset Filters
    </button>
  </div>
</div>

<!-- Courses Grid -->
<div class="row g-3">
  <div class="col-md-6" *ngFor="let course of courses">
    <div class="card h-100 course-card">

      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{course.title}}</h5>

        <p class="card-text"><strong>Provider:</strong> {{course.provider}}</p>

        <p class="card-text"><strong>Category:</strong> {{course.category}}</p>

        <p class="card-text"><strong>Price:</strong> ${{course.price}}</p>

        <p class="card-text" *ngIf="course.refundable !== undefined">
          <strong>Refundable:</strong>
          <span class="badge ms-1" [ngClass]="course.refundable ? 'bg-success' : 'bg-secondary'">
            {{course.refundable ? 'Yes' : 'No'}}
          </span>
        </p>

        <div class="mt-auto pt-3 d-flex gap-2 flex-wrap">
          <a *ngIf="course.externalUrl"
             [href]="course.externalUrl"
             target="_blank"
             rel="noopener noreferrer"
             class="btn btn-outline-secondary btn-sm">
            Open Course ↗
          </a>

          <button class="btn btn-primary btn-sm"
                  type="button"
                  [disabled]="!course.id || enrollingCourseIds.has(course.id || 0) || isUserEnrolled(course.id)"
                  (click)="enroll(course)"
                  [title]="isUserEnrolled(course.id) ? 'Already enrolled' : ''">
            {{
              isUserEnrolled(course.id)
                ? 'Already Enrolled'
                : enrollingCourseIds.has(course.id || 0)
                  ? 'Enrolling...'
                  : 'Enroll'
            }}
          </button>
        </div>
      </div>

    </div>
  </div>
</div>

<div *ngIf="courses.length === 0" class="alert alert-info mt-3">
  No courses found. Please adjust your filters.
</div>
