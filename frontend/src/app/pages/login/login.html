<h2>Login</h2>

<form [formGroup]="form" (ngSubmit)="login()">

  <input
    type="text"
    formControlName="username"
    placeholder="Username"
  />

  <br><br>

  <input
    type="password"
    formControlName="password"
    placeholder="Password"
  />

  <br><br>

  <button type="submit">
    Login
  </button>

</form>
